name: Build Windows
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Preparar compilador validado
        shell: pwsh
        run: ./scripts/Get-InnoSetup.ps1
      - name: Testar migração com dados sintéticos
        shell: pwsh
        run: |
          dotnet run --project tests/MigrationTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Testes de migração falharam.' }
      - name: Testar atalhos globais por polling
        shell: pwsh
        run: |
          dotnet run --project tests/HotkeyRegistrationTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Testes de atalhos globais falharam.' }
      - name: Testar edição temporária de presets
        shell: pwsh
        run: |
          dotnet run --project tests/PresetEditingTests.csproj -c Release -- $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Testes de edição de presets falharam.' }
      - name: Testar trajetórias, conversão de força e atualizador
        shell: pwsh
        run: |
          dotnet run --project tests/TrajectoryTests.csproj -c Release -- $env:RUNNER_TEMP
          if ($LASTEXITCODE -ne 0) { throw 'Testes de trajetórias falharam.' }
          dotnet run --project tests/PresetForceMigrationTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Migração de força falhou.' }
          dotnet run --project tests/UpdateTests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Testes do atualizador falharam.' }
      - name: Importar certificado legítimo (somente tags)
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          VELQORA_PFX_BASE64: ${{ secrets.VELQORA_PFX_BASE64 }}
          VELQORA_PFX_PASSWORD: ${{ secrets.VELQORA_PFX_PASSWORD }}
        run: |
          if ($env:VELQORA_PFX_BASE64 -or $env:VELQORA_PFX_PASSWORD) {
            ./scripts/Import-SigningCertificate.ps1
          } else { Write-Host 'Build NÃO ASSINADO: certificado não configurado.' }
      - name: Compilar, assinar quando configurado e empacotar
        id: package
        shell: pwsh
        run: ./scripts/build-installer.ps1 -Sign:([bool]$env:VELQORA_SIGN_THUMBPRINT)
      - name: Testar interface avançada sem iniciar o macro
        shell: pwsh
        env:
          PACKAGE_RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
        run: powershell.exe -NoProfile -STA -ExecutionPolicy Bypass -File scripts/Test-TrajectoryEditor.ps1 -AssemblyPath "$env:PACKAGE_RELEASE_DIR/Velqora.exe"
      - name: Testar instalação com identidade isolada
        timeout-minutes: 10
        shell: pwsh
        env:
          PACKAGE_RELEASE_DIR: ${{ steps.package.outputs.release_dir }}
        run: ./scripts/Test-Installer.ps1 -Iscc $env:VELQORA_ISCC -Payload $env:PACKAGE_RELEASE_DIR
      - name: Preservar artefatos de build
        uses: actions/upload-artifact@v4
        with:
          name: Velqora-Windows
          path: ${{ steps.package.outputs.release_dir }}/*
          if-no-files-found: error
      - name: Remover certificado do runner
        if: always()
        shell: pwsh
        run: |
          if ($env:VELQORA_SIGN_THUMBPRINT) {
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$env:VELQORA_SIGN_THUMBPRINT" -DeleteKey -ErrorAction Stop
          }
  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Velqora-Windows
          path: release
      - name: Publicar arquivos explícitos na release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem release -File | Where-Object Name -ne 'RELEASE-NOTES.md' | ForEach-Object FullName)
          gh release create $env:RELEASE_TAG @files --verify-tag --title "Velqora $env:RELEASE_TAG" --notes-file release/RELEASE-NOTES.md
          if ($LASTEXITCODE -ne 0) { throw 'Falha ao publicar release; nenhuma release existente foi sobrescrita.' }
